<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои книги</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Мои книги</h1>

        <form id="book-form" class="form">
            <input id="title-input" type="text" placeholder="Название">
            <input id="author-input" type="text" placeholder="Автор">
            <button type="submit">Добавить</button>
        </form>
        <p id="error" class="error"></p>

        <input id="search-input" type="search" placeholder="Поиск">
        <p id="stats" class="stats"></p>

        <ul id="book-list" class="list"></ul>
        <p id="empty" class="empty" hidden>Список пуст</p>
    </main>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
